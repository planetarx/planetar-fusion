# Stage 1, dual-pol (VH + VV) variant for bb's RTX 2070 — the demo model planetar-sat can run
# (Task 9). Sentinel-1 IW GRDH 1SDV products carry both polarisations, but not xView3's
# bathymetry / wind rasters, so this drops those three channels. Per-tile z-scoring makes it
# indifferent to a constant dB offset, so GRD DN → dB is close enough to try at inference.
# xView3 is CC BY-NC-SA: these weights are demo/benchmark only (DESIGN §3), never shipped.
# Sized as configs/stage1-2070.yaml (batch 2, ~1.8 h/epoch once the SAR rasters are re-tiled).
data:
  root: data/xview3
  train_labels: data/xview3/split/train.csv
  val_labels: data/xview3/split/holdout.csv
  channels: [VH_dB, VV_dB]
  tile: 800
  stride: 704
model:
  base: 32
train:
  epochs: 12
  batch_size: 2
  lr: 0.0003
  weight_decay: 0.05   # on conv weights; see train.make_optimizer
  num_workers: 4
  device: cuda
  amp: true
  max_grad_norm: 5.0   # clip; see train.train_step
out:
  ckpt_dir: checkpoints/stage1-dualpol
  run_dir: runs/stage1-dualpol
