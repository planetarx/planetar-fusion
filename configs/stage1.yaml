# Stage 1 — xView3 SAR detector, full 5-channel xView3 stack (the leaderboard-comparable run).
# Paths assume Task 0 staged the validation split under data/xview3 and
# `python -m planetar_fusion.bench split` wrote data/xview3/split/ (scenes, not rows).
data:
  root: data/xview3
  train_labels: data/xview3/split/train.csv
  val_labels: data/xview3/split/holdout.csv
  channels: [VH_dB, VV_dB, bathymetry, owiMask, owiWindSpeed]
  tile: 800
  stride: 704
model:
  base: 32
train:
  epochs: 20
  batch_size: 8
  lr: 0.0003
  weight_decay: 0.05   # on conv weights; see train.make_optimizer
  num_workers: 8
  device: cuda
  amp: true
  max_grad_norm: 5.0   # clip; see train.train_step
out:
  ckpt_dir: checkpoints/stage1
  run_dir: runs/stage1
