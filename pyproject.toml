[project]
name = "planetar-fusion"
version = "0.1.0"
description = "planetar v0 learned SAR<->AIS dark-vessel model — Stage 1: xView3 SAR detector"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "torchgeo>=0.6", "rasterio>=1.3",
  "numpy>=1.26", "pandas>=2.1", "pyyaml>=6", "tqdm>=4.66", "scipy>=1.11",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
